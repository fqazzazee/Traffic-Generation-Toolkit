name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: selftest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      # tshark lets the dissection / expert-info groups run instead of skip.
      - name: Install tshark
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" \
            | sudo debconf-set-selections
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends tshark
          tshark --version | head -n 1

      - name: Self-test (from the repo root, no PYTHONPATH)
        run: python tests/selftest.py

      - name: Self-test as a module
        run: python -m tests.selftest

      - name: Install and check the CLI entry point
        run: |
          python -m pip install --quiet .
          cd "$RUNNER_TEMP"
          tgt --version
          test "$(tgt --version)" = "tgt $(python -c 'import tgt; print(tgt.__version__)')"
          tgt run -p modbus --count 10 --rate 0 --pcap ci.pcap
          tshark -r ci.pcap -q -z io,stat,0

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version | head -n 2
          shellcheck scripts/*.sh docker-entrypoint.sh
